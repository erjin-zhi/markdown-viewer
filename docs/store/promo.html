<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=440, initial-scale=1">
  <title>Markdown Viewer — 阅读 · 编辑 · 对比</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 440px; height: 280px; margin: 0; }
    body {
      overflow: hidden;
      background: linear-gradient(135deg, #123c39 0%, #174b44 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 26px 30px 10px; }
    .brand img { display: block; flex: 0 0 46px; width: 46px; height: 46px; }
    .name { margin: 0; font-size: 25px; line-height: 32px; letter-spacing: -1px; font-weight: 650; white-space: nowrap; }
    .sub { margin: 0 30px 17px; color: #b5dfd2; font-size: 13px; line-height: 20px; letter-spacing: 1.4px; }
    .panes { display: flex; gap: 10px; margin: 0 30px; }
    .card {
      flex: 0 0 185px;
      width: 185px;
      height: 136px;
      padding: 16px;
      border: 1px solid #ffffff80;
      border-radius: 10px;
      background: #f8fafb;
      color: #284c47;
      box-shadow: 0 8px 22px #0002;
    }
    .heading { margin: 0 0 10px; font-size: 19px; line-height: 23px; font-weight: 650; letter-spacing: -.4px; }
    .line { width: 90%; height: 6px; margin-bottom: 8px; border-radius: 3px; background: #d9e6e1; }
    .line.short { width: 62%; }
    .code { margin-top: 12px; padding: 6px 9px; border-radius: 5px; background: #e5f1ec; color: #197364; font: 11px/18px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
    .minus, .plus { height: 24px; padding: 4px 8px; border-radius: 4px; font: 12px/16px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .minus { margin-top: 8px; background: #ffe3df; color: #a3433e; }
    .plus { margin-top: 5px; background: #c8edda; color: #166d48; }
  </style>
</head>
<body>
  <header class="brand">
    <img src="../assets/logo.svg" alt="">
    <h1 class="name">Markdown Viewer</h1>
  </header>
  <p class="sub">阅读 · 编辑 · 对比</p>
  <div class="panes" aria-label="Markdown preview and difference comparison">
    <section class="card" aria-label="Markdown preview">
      <h2 class="heading"># Markdown</h2>
      <div class="line" aria-hidden="true"></div>
      <div class="line short" aria-hidden="true"></div>
      <div class="code">{ "readable": true }</div>
    </section>
    <section class="card" aria-label="Difference comparison">
      <h2 class="heading">改动对比</h2>
      <div class="line short" aria-hidden="true"></div>
      <div class="minus">− 修改前</div>
      <div class="plus">+ 修改后</div>
    </section>
  </div>
</body>
</html>
